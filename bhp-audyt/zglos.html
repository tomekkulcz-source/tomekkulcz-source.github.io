<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zgłoś zagrożenie</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--soft:#5b5852;--line:#dcd8cf;--acc:#b45309;--acc-ink:#fff;--warn:#fdecec;--warn-ink:#9f1239;}
  @media (prefers-color-scheme: dark){:root{--bg:#161514;--card:#201f1d;--ink:#f1efe9;--soft:#b3afa6;--line:#3a3833;--acc:#f59e0b;--acc-ink:#1d1c1a;--warn:#3b1219;--warn-ink:#fda4af;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .langs{display:flex;gap:4px}
  .langs button{font:inherit;font-size:13px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .langs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  h1{font-size:24px;line-height:1.25;margin:10px 0 2px;text-wrap:balance}
  .cl{color:var(--soft);font-size:14px}
  .sos{background:var(--warn);color:var(--warn-ink);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px}
  form{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
  .opt{font-weight:400;color:var(--soft);font-size:13px}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
  textarea{min-height:96px;resize:vertical}
  .types{display:grid;gap:8px}
  .types label{flex-direction:row;align-items:flex-start;gap:10px;font-weight:500;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .types input{width:20px;height:20px;padding:0;margin:2px 0 0;flex:0 0 auto;accent-color:var(--acc)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button.main{font:inherit;font-weight:700;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:14px;font-size:17px}
  button.sec{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
  .note{color:var(--soft);font-size:13px}
  .done{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
  .err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:30px}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"><div class="err">…</div></main>
<script>
(async function(){
  const T = {
    pl:{kick:'Zgłoszenie BHP', h:'Zgłoś zagrożenie lub zdarzenie', sos:'Ktoś jest ranny? Udziel pomocy, dzwoń pod 112 i natychmiast powiadom przełożonego. O zauważonym wypadku lub zagrożeniu życia albo zdrowia pracownik zawiadamia przełożonego niezwłocznie i ostrzega osoby w pobliżu (art. 211 pkt 6 Kodeksu pracy) — ten formularz tego nie zastępuje.',
      type:'Co zgłaszasz?', t1:'Zagrożenie lub niebezpieczna sytuacja (np. uszkodzona osłona, śliska podłoga, zastawione wyjście)', t2:'Zdarzenie bez urazu, które mogło skończyć się wypadkiem (near miss)', t3:'Pomysł na poprawę bezpieczeństwa',
      where:'Gdzie?', whereOther:'inne miejsce — wpisz', when:'Kiedy?', what:'Co się stało / co zauważyłeś?', whatPh:'Opisz krótko, co i gdzie dokładnie.', fix:'Co można poprawić?', fixPh:'Twoja propozycja (opcjonalnie)', who:'Imię i nazwisko', whoOpt:'(możesz zostawić puste)', photo:'Zdjęcie', photoOpt:'(opcjonalnie — tylko przy wysyłce z telefonu)',
      send:'Wyślij zgłoszenie', copy:'Kopiuj zgłoszenie', privacy:'Zgłoszenie wysyłasz e-mailem lub komunikatorem ze swojego telefonu do specjalisty BHP. Strona niczego nie zapisuje. Jeśli nie wpiszesz nazwiska, nadawca wiadomości i tak będzie widoczny w poczcie.', needWhat:'Opisz, co się stało.', thanks:'Dziękujemy! Twoje zgłoszenie pomaga zapobiegać wypadkom.', copied:'Skopiowano — wklej i wyślij osobie odpowiedzialnej za BHP.', noTo:'Brak adresu specjalisty w kodzie — skopiuj zgłoszenie i przekaż je przełożonemu.', subj:'Zgłoszenie BHP', bad:'Nie udało się otworzyć formularza. Zeskanuj kod ponownie.', anon:'anonimowo', code:'Kod dla aplikacji EHS Polska (nie usuwaj):'},
    en:{kick:'Safety report', h:'Report a hazard or incident', sos:'Is someone injured? Give first aid, call 112 and tell your supervisor immediately. This form does not replace reporting accidents or danger to your supervisor right away.',
      type:'What are you reporting?', t1:'A hazard or dangerous situation (e.g. missing guard, slippery floor, blocked exit)', t2:'An incident without injury that could have caused an accident (near miss)', t3:'An idea to improve safety',
      where:'Where?', whereOther:'other place — type it', when:'When?', what:'What happened / what did you notice?', whatPh:'Describe briefly what and where exactly.', fix:'What could be improved?', fixPh:'Your suggestion (optional)', who:'Your name', whoOpt:'(you can leave it empty)', photo:'Photo', photoOpt:'(optional — only when sending from a phone)',
      send:'Send report', copy:'Copy report', privacy:'You send the report by e-mail or messenger from your phone to the health and safety specialist. This page stores nothing. If you leave your name empty, the sender address is still visible in the e-mail.', needWhat:'Describe what happened.', thanks:'Thank you! Your report helps prevent accidents.', copied:'Copied — paste it and send it to the person responsible for safety.', noTo:'No specialist address in the code — copy the report and give it to your supervisor.', subj:'Safety report', bad:'Could not open the form. Scan the code again.', anon:'anonymous', code:'Code for the EHS Polska app (do not remove):'},
    uk:{kick:'Повідомлення з охорони праці', h:'Повідомити про небезпеку або подію', sos:'Хтось травмований? Надайте допомогу, телефонуйте 112 і негайно повідомте керівника. Ця форма не замінює негайного повідомлення керівника про нещасний випадок або загрозу.',
      type:'Про що ви повідомляєте?', t1:'Небезпека або небезпечна ситуація (напр. знятий захист, слизька підлога, заблокований вихід)', t2:'Подія без травми, яка могла призвести до нещасного випадку', t3:'Ідея щодо покращення безпеки',
      where:'Де?', whereOther:'інше місце — впишіть', when:'Коли?', what:'Що сталося / що ви помітили?', whatPh:'Коротко опишіть, що і де саме.', fix:'Що можна покращити?', fixPh:'Ваша пропозиція (необов’язково)', who:'Ім’я та прізвище', whoOpt:'(можна залишити порожнім)', photo:'Фото', photoOpt:'(необов’язково — лише під час надсилання з телефону)',
      send:'Надіслати повідомлення', copy:'Скопіювати повідомлення', privacy:'Ви надсилаєте повідомлення електронною поштою або месенджером зі свого телефону спеціалісту з охорони праці. Сторінка нічого не зберігає. Якщо не вкажете ім’я, адреса відправника все одно буде видна в листі.', needWhat:'Опишіть, що сталося.', thanks:'Дякуємо! Ваше повідомлення допомагає запобігати нещасним випадкам.', copied:'Скопійовано — вставте й надішліть відповідальній особі.', noTo:'У коді немає адреси спеціаліста — скопіюйте повідомлення і передайте його керівнику.', subj:'Повідомлення з охорони праці', bad:'Не вдалося відкрити форму. Відскануйте код ще раз.', anon:'анонімно', code:'Код для програми EHS Polska (не видаляйте):'}
  };
  const app = document.getElementById('app');
  const esc = s=>String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function b64(bytes){ let b = ''; for(let i=0;i<bytes.length;i+=0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; const r = atob(s), u = new Uint8Array(r.length); for(let i=0;i<r.length;i++) u[i] = r.charCodeAt(i); return u; }
  async function unpack(h){ const d = unb64(h.slice(1)); const raw = h[0]==='z' ? new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : d; return JSON.parse(new TextDecoder().decode(raw)); }
  async function pack(o){ const raw = new TextEncoder().encode(JSON.stringify(o)); if(typeof CompressionStream==='undefined') return 'j'+b64(raw); return 'z'+b64(new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())); }
  let P;
  try{ P = await unpack(decodeURIComponent(location.hash.slice(1))); if(P.k!=='zgl') throw 0; }
  catch(e){ app.innerHTML = '<div class="err">'+esc(T.pl.bad)+'<br>'+esc(T.en.bad)+'<br>'+esc(T.uk.bad)+'</div>'; return; }
  const nav = (navigator.language||'pl').slice(0,2).toLowerCase();
  let lg = nav==='uk' || nav==='ru' ? 'uk' : nav==='pl' ? 'pl' : (nav==='en' ? 'en' : 'pl');
  const now = new Date(); const pad = n=>String(n).padStart(2,'0');
  const state = {type:'t1', where:'', other:'', date:now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()), time:pad(now.getHours())+':'+pad(now.getMinutes()), what:'', fix:'', who:'', photo:null};
  function read(){ const f = document.getElementById('f'); if(!f) return; const q = n=>f.querySelector('[name="'+n+'"]'); const t = f.querySelector('[name="type"]:checked'); state.type = t ? t.value : state.type; ['where','other','date','time','what','fix','who'].forEach(k=>{ const i = q(k); if(i) state[k] = i.value; }); const ph = q('photo'); if(ph && ph.files && ph.files[0]) state.photo = ph.files[0]; }
  function render(msg){
    const L = T[lg]; const locs = (P.l||[]).filter(Boolean);
    document.documentElement.lang = lg; document.title = L.h;
    app.innerHTML = '<div class="top"><span class="kick">'+esc(L.kick)+'</span><div class="langs">'+['pl','en','uk'].map(x=>'<button type="button" data-lg="'+x+'" class="'+(x===lg?'on':'')+'">'+x.toUpperCase()+'</button>').join('')+'</div></div>'
      +'<h1>'+esc(L.h)+'</h1><div class="cl">'+esc(P.c||'')+'</div>'
      +'<div class="sos">'+esc(L.sos)+'</div>'
      +(msg ? '<div class="done">'+esc(msg)+'</div>' : '')
      +'<form id="f" novalidate>'
        +'<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:6px">'+esc(L.type)+'</legend><div class="types">'+['t1','t2','t3'].map(t=>'<label><input type="radio" name="type" value="'+t+'"'+(state.type===t?' checked':'')+'><span>'+esc(L[t])+'</span></label>').join('')+'</div></fieldset>'
        +'<label>'+esc(L.where)+(locs.length ? '<select name="where">'+locs.map(x=>'<option'+(state.where===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'<option value=""'+(state.where===''&&state.other?' selected':'')+'>'+esc(L.whereOther)+'</option></select>' : '')+'<input name="other" value="'+esc(state.other)+'" placeholder="'+esc(locs.length?L.whereOther:'')+'"></label>'
        +'<div class="row"><label>'+esc(L.when)+'<input type="date" name="date" value="'+esc(state.date)+'"></label><label>&nbsp;<input type="time" name="time" value="'+esc(state.time)+'"></label></div>'
        +'<label>'+esc(L.what)+'<textarea name="what" placeholder="'+esc(L.whatPh)+'">'+esc(state.what)+'</textarea></label>'
        +'<label>'+esc(L.fix)+'<textarea name="fix" placeholder="'+esc(L.fixPh)+'" style="min-height:64px">'+esc(state.fix)+'</textarea></label>'
        +'<label>'+esc(L.who)+' <span class="opt">'+esc(L.whoOpt)+'</span><input name="who" value="'+esc(state.who)+'" autocomplete="name"></label>'
        +'<label>'+esc(L.photo)+' <span class="opt">'+esc(L.photoOpt)+'</span><input type="file" name="photo" accept="image/*" capture="environment"></label>'
        +'<button type="submit" class="main">'+esc(L.send)+'</button><button type="button" class="sec" id="cp">'+esc(L.copy)+'</button>'
        +'<p class="note">'+esc(L.privacy)+'</p>'
      +'</form>';
    app.querySelectorAll('[data-lg]').forEach(b=>b.onclick = ()=>{ read(); lg = b.dataset.lg; render(); });
    document.getElementById('f').onsubmit = ev=>{ ev.preventDefault(); send(); };
    document.getElementById('cp').onclick = ()=>copy();
  }
  async function build(){
    read(); const L = T[lg];
    if(!state.what.trim()){ alert(L.needWhat); return null; }
    const where = [state.where, state.other].filter(Boolean).join(' — ');
    const typeTxt = T.pl[state.type];
    const rec = {v:1, k:'zgl', i:P.i||'', c:P.c||'', t:state.type, w:where, d:state.date, tm:state.time, o:state.what.trim(), p:state.fix.trim(), n:state.who.trim(), lg};
    const code = 'BHPZ1:'+await pack(rec);
    const human = [L.subj+' — '+(P.c||''), '', (lg==='pl'?'Rodzaj':'Type')+': '+L[state.type]+(lg!=='pl'?' ['+typeTxt+']':''), (lg==='pl'?'Miejsce':'Place')+': '+(where||'—'), (lg==='pl'?'Kiedy':'When')+': '+state.date+' '+state.time, '', state.what.trim(), state.fix.trim() ? '\n'+L.fix+' '+state.fix.trim() : '', '', L.who+': '+(state.who.trim()||L.anon), '', L.code, code].join('\n');
    return {human, subject:L.subj+(P.c?' — '+P.c:''), code};
  }
  async function send(){
    const b = await build(); if(!b) return; const L = T[lg];
    if(state.photo && navigator.canShare && navigator.canShare({files:[state.photo]})){
      try{ await navigator.share({files:[state.photo], title:b.subject, text:b.human}); render(L.thanks); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    if(!P.e){ await copy(); alert(L.noTo); return; }
    location.href = 'mailto:'+encodeURIComponent(P.e)+'?subject='+encodeURIComponent(b.subject)+'&body='+encodeURIComponent(b.human);
    setTimeout(()=>render(L.thanks), 800);
  }
  async function copy(){ const b = await build(); if(!b) return; try{ await navigator.clipboard.writeText(b.human); alert(T[lg].copied); }catch(e){ prompt('', b.human); } }
  render();
})();
</script>
</body>
</html>
