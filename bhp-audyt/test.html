  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}

  .kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
  .langs{display:flex;gap:4px}
  .langs button{font:inherit;font-size:13px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .langs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  h1{font-size:24px;line-height:1.25;margin:10px 0 2px;text-wrap:balance}
  .cl{color:var(--soft);font-size:14px}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600;margin-top:12px}
  input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  .q h2{font-size:16px;margin:0 0 10px;font-weight:600}
  .q .n{color:var(--soft);font-variant-numeric:tabular-nums;margin-right:6px}
  .a{display:flex;flex-direction:row;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;font-weight:400}
  .a input{width:20px;height:20px;padding:0;margin:2px 0 0;flex:0 0 auto;accent-color:var(--acc)}
  .a.ok{background:var(--ok-bg);border-color:var(--ok)}
  .a.bad{background:var(--bad-bg);border-color:var(--bad)}
  button.main{font:inherit;font-weight:700;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:14px;font-size:17px;width:100%;margin-top:16px}
  button.sec{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;margin-top:8px}
  .res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
  .score{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
  .pass{color:var(--ok)} .fail{color:var(--bad)}
  .note{color:var(--soft);font-size:13px}
  .err{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:30px}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

  function unb64(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; const r = atob(s), u = new Uint8Array(r.length); for(let i=0;i<r.length;i++) u[i] = r.charCodeAt(i); return u; }
